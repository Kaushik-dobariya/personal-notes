{% extends "layouts/auth.html" %}

{% block title %}Set New Password - Personal Notes{% endblock %}

{% block content %}
<div class="card auth-card shadow-sm border-0 p-4">
  <h2 class="h5 fw-bold mb-2 text-center">Set New Password</h2>
  <p class="text-muted small text-center mb-3">
    Create a secure new password for your account.
  </p>

  {% if error %}
  <div class="alert alert-danger alert-dismissible fade show small py-2" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
    <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endif %}

  <form method="POST" action="/auth/reset-password">
    <input type="hidden" name="token" value="{{ token }}">

    <div class="mb-3">
      <label for="new_password" class="form-label small fw-semibold">New Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" class="form-control" id="new_password" name="new_password" placeholder="At least 8 characters" minlength="8" required autofocus>
      </div>
    </div>

    <div class="mb-3">
      <label for="confirm_password" class="form-label small fw-semibold">Confirm New Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" minlength="8" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
      Update Password
    </button>
  </form>

  <div class="text-center mt-4 pt-2 border-top">
    <a href="/auth/login" class="small text-muted text-decoration-none">
      <i class="bi bi-arrow-left me-1"></i> Back to Sign In
    </a>
  </div>
</div>
{% endblock %}
