{% extends "layouts/auth.html" %}

{% block title %}Sign In - Personal Notes{% endblock %}

{% block content %}
<div class="card auth-card shadow-sm border-0 p-4">
  <h2 class="h5 fw-bold mb-3 text-center">Welcome Back</h2>

  {% if error %}
  <div class="alert alert-danger alert-dismissible fade show small py-2" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
    <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endif %}

  {% if message %}
  <div class="alert alert-success alert-dismissible fade show small py-2" role="alert">
    <i class="bi bi-check-circle-fill me-1"></i> {{ message }}
    <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endif %}

  <form method="POST" action="/auth/login" class="needs-validation">
    <div class="mb-3">
      <label for="email" class="form-label small fw-semibold">Email Address</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="you@example.com" required autofocus>
      </div>
    </div>

    <div class="mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <label for="password" class="form-label small fw-semibold mb-0">Password</label>
        <a href="/auth/forgot-password" class="small text-decoration-none">Forgot password?</a>
      </div>
      <div class="input-group mt-1">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
      Sign In
    </button>
  </form>

  <div class="text-center mt-4 pt-2 border-top">
    <p class="small text-muted mb-0">
      Don't have an account? 
      <a href="/auth/signup" class="text-primary fw-semibold text-decoration-none">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
