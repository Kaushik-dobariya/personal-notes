{% extends "layouts/base.html" %}

{% block title %}Create Note - Personal Notes{% endblock %}

{% block content %}
<div class="container-fluid px-0" style="max-width: 800px; margin: 0 auto;">
  
  <!-- Back Button & Header -->
  <div class="d-flex align-items-center justify-content-between mb-4">
    <a href="/" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
      <i class="bi bi-arrow-left me-1"></i> Back to Notes
    </a>
    <span class="text-muted small">New Note</span>
  </div>

  <div class="card shadow-sm border" style="border-color: var(--card-border) !important; background-color: var(--card-bg);">
    <div class="card-header bg-transparent py-3 border-bottom" style="border-color: var(--card-border) !important;">
      <h1 class="h4 fw-bold mb-0 d-flex align-items-center">
        <i class="bi bi-pencil-square text-primary me-2"></i> Create Note
      </h1>
    </div>

    <div class="card-body p-4">
      {% if error %}
      <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2"></i>
        <div>{{ error }}</div>
      </div>
      {% endif %}

      <form method="POST" action="/notes" id="create-note-form">
        <div class="mb-3">
          <label for="title" class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
          <input 
            type="text" 
            class="form-control form-control-lg" 
            id="title" 
            name="title" 
            placeholder="Enter note title..." 
            value="{{ title or '' }}" 
            required 
            maxlength="255"
            autofocus>
        </div>

        <div class="mb-4">
          <label for="content" class="form-label fw-semibold">Content</label>
          <textarea 
            class="form-control" 
            id="content" 
            name="content" 
            rows="10" 
            placeholder="Write your note here...">{{ content or '' }}</textarea>
        </div>

        <div class="d-flex align-items-center justify-content-end gap-2 pt-2 border-top" style="border-color: var(--card-border) !important;">
          <a href="/" class="btn btn-outline-secondary px-4">Cancel</a>
          <button type="submit" class="btn btn-primary px-4 d-flex align-items-center">
            <i class="bi bi-check-lg me-1"></i> Save Note
          </button>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
