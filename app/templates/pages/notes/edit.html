{% extends "layouts/base.html" %}

{% block title %}Edit Note - {{ note.title }}{% endblock %}

{% block content %}
<div class="container-fluid px-0" style="max-width: 800px; margin: 0 auto;">
  
  <!-- Navigation bar / Actions -->
  <div class="d-flex align-items-center justify-content-between mb-4">
    <a href="/notes/{{ note.id }}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
      <i class="bi bi-arrow-left me-1"></i> Back to Note
    </a>
    <span class="text-muted small">Editing Note #{{ note.id }}</span>
  </div>

  <div class="card shadow-sm border" style="border-color: var(--card-border) !important; background-color: var(--card-bg);">
    <div class="card-header bg-transparent py-3 border-bottom d-flex justify-content-between align-items-center" style="border-color: var(--card-border) !important;">
      <h1 class="h4 fw-bold mb-0 d-flex align-items-center">
        <i class="bi bi-pencil text-primary me-2"></i> Edit Note
      </h1>

      <form method="POST" action="/notes/{{ note.id }}/delete" onsubmit="return confirm('Are you sure you want to delete this note?');" class="d-inline">
        <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3" title="Delete Note">
          <i class="bi bi-trash3 me-1"></i> Delete
        </button>
      </form>
    </div>

    <div class="card-body p-4">
      {% if error %}
      <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2"></i>
        <div>{{ error }}</div>
      </div>
      {% endif %}

      <form method="POST" action="/notes/{{ note.id }}/edit" id="edit-note-form">
        <div class="mb-3">
          <label for="title" class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
          <input 
            type="text" 
            class="form-control form-control-lg" 
            id="title" 
            name="title" 
            placeholder="Enter note title..." 
            value="{{ note.title }}" 
            required 
            maxlength="255"
            autofocus>
        </div>

        <div class="mb-4">
          <label for="content" class="form-label fw-semibold">Content</label>
          <textarea 
            class="form-control" 
            id="content" 
            name="content" 
            rows="10" 
            placeholder="Write your note here...">{{ note.content }}</textarea>
        </div>

        <div class="d-flex align-items-center justify-content-between pt-3 border-top" style="border-color: var(--card-border) !important;">
          <div class="text-muted small">
            Created: {{ note.created_at.strftime('%b %d, %Y') }}
          </div>
          <div class="d-flex align-items-center gap-2">
            <a href="/notes/{{ note.id }}" class="btn btn-outline-secondary px-4">Cancel</a>
            <button type="submit" class="btn btn-primary px-4 d-flex align-items-center">
              <i class="bi bi-check-lg me-1"></i> Save Changes
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
