<div id="note-tags-{{ note.id }}" class="note-tags-container mb-3">
  <div class="d-flex align-items-center justify-content-between mb-1">
    <span class="text-muted small fw-semibold" style="font-size: 0.75rem;">Tags:</span>
    <button type="button" 
            class="btn btn-sm btn-link text-muted p-0 text-decoration-none" 
            style="font-size: 0.725rem;"
            hx-get="/notes/{{ note.id }}/tags"
            hx-target="#note-tags-{{ note.id }}"
            hx-swap="outerHTML">
      Cancel
    </button>
  </div>

  <div class="d-flex flex-wrap align-items-center gap-1 mb-2">
    {% for tag in note.tags %}
    <span class="badge rounded-pill bg-body-secondary text-body-emphasis border d-inline-flex align-items-center py-1 px-2" style="font-size: 0.75rem; font-weight: 500;">
      #{{ tag.name }}
      <button type="button" 
              class="btn-close ms-1" 
              style="font-size: 0.5rem; padding: 0.2rem;" 
              aria-label="Remove tag"
              title="Remove #{{ tag.name }}"
              hx-delete="/notes/{{ note.id }}/tags/{{ tag.id }}"
              hx-target="#note-tags-{{ note.id }}"
              hx-swap="outerHTML"></button>
    </span>
    {% endfor %}
  </div>

  <form class="d-flex align-items-center gap-1"
        hx-post="/notes/{{ note.id }}/tags"
        hx-target="#note-tags-{{ note.id }}"
        hx-swap="outerHTML">
    <div class="input-group input-group-sm">
      <span class="input-group-text py-0 px-2 text-muted" style="font-size: 0.75rem;">#</span>
      <input type="text" 
             name="name" 
             list="user-tags-datalist-{{ note.id }}"
             class="form-control form-control-sm py-0 px-2" 
             placeholder="Tag name..." 
             style="font-size: 0.75rem;"
             autocomplete="off"
             required 
             autofocus>
      <datalist id="user-tags-datalist-{{ note.id }}">
        {% for t in all_tags %}
        <option value="{{ t.name }}">
        {% endfor %}
      </datalist>
      <button class="btn btn-primary btn-sm py-0 px-2" type="submit" style="font-size: 0.75rem;">
        Add
      </button>
    </div>
  </form>
</div>
