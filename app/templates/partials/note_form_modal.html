<div class="modal fade show d-block" id="noteModal" tabindex="-1" aria-labelledby="noteModalLabel" aria-modal="true" role="dialog" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow rounded-3">
      
      <div class="modal-header border-bottom py-3" style="border-color: var(--card-border) !important;">
        <h5 class="modal-title fw-bold fs-6" id="noteModalLabel">
          <i class="bi bi-file-earmark-plus me-1 text-primary"></i> Create New Note
        </h5>
        <button type="button" class="btn-close" aria-label="Close" onclick="document.getElementById('modal-container').innerHTML = ''"></button>
      </div>

      <form hx-post="/notes" 
            hx-target="#notes-list-container" 
            hx-swap="innerHTML"
            hx-indicator="#modal-spinner">
        <div class="modal-body py-3">
          
          <div class="mb-3">
            <label for="title" class="form-label small fw-semibold">Note Title *</label>
            <input type="text" class="form-control form-control-sm" id="title" name="title" placeholder="E.g. Meeting summary, Project ideas..." required autofocus>
          </div>

          <div class="mb-3">
            <label for="content" class="form-label small fw-semibold">Content / Description</label>
            <textarea class="form-control form-control-sm" id="content" name="content" rows="5" placeholder="Write your thoughts here..."></textarea>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label for="category_id" class="form-label small fw-semibold">Category</label>
              <select class="form-select form-select-sm" id="category_id" name="category_id">
                <option value="">-- Uncategorized --</option>
                {% for cat in all_categories %}
                <option value="{{ cat.id }}" {% if current_category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-6">
              <label for="tag_names" class="form-label small fw-semibold">Tags (comma separated)</label>
              <input type="text" class="form-control form-control-sm" id="tag_names" name="tag_names" placeholder="work, ideas, todo">
            </div>
          </div>

          <div class="d-flex gap-3 pt-1">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="is_pinned" name="is_pinned" value="true">
              <label class="form-check-label small" for="is_pinned">Pin to Top</label>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="is_favorite" name="is_favorite" value="true">
              <label class="form-check-label small" for="is_favorite">Mark as Favorite</label>
            </div>
          </div>

        </div>

        <div class="modal-footer border-top py-2" style="border-color: var(--card-border) !important;">
          <span class="spinner-border spinner-border-sm text-primary htmx-indicator me-auto" id="modal-spinner" role="status"></span>
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('modal-container').innerHTML = ''">Cancel</button>
          <button type="submit" class="btn btn-sm btn-primary px-3 fw-semibold">Save Note</button>
        </div>
      </form>

    </div>
  </div>
</div>
