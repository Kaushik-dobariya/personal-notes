<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Personal Notes - Auth{% endblock %}</title>
  <meta name="description" content="Personal Notes - Sign in to manage your notes">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom App Styles -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

  <!-- Top-right theme toggle -->
  <div class="position-absolute top-0 end-0 p-3">
    <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" id="theme-toggle" type="button" title="Toggle Theme">
      <i class="bi bi-sun-fill text-warning" id="theme-icon"></i>
    </button>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        
        <!-- Brand Logo Header -->
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 p-2 mb-2 shadow-sm" style="width: 48px; height: 48px;">
            <i class="bi bi-journal-bookmark-fill fs-4"></i>
          </div>
          <h1 class="h3 fw-bold mb-1">Personal Notes</h1>
          <p class="text-muted small">Capture thoughts, ideas, and tasks seamlessly</p>
        </div>

        <!-- Auth Card Content -->
        {% block content %}{% endblock %}

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <!-- Custom App JS -->
  <script src="/static/js/app.js"></script>
</body>
</html>
