<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Personal Notes{% endblock %}</title>
  <meta name="description" content="Personal Notes - Fast, interactive, modern note taking application">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom App Styles -->
  <link rel="stylesheet" href="/static/css/style.css">

  <!-- HTMX -->
  <script src="/static/js/htmx.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Global HTMX Top Progress Bar -->
  <div id="htmx-progress-bar" role="progressbar" aria-hidden="true"></div>

  <!-- Top Navigation / Toolbar -->
  <header>
    {% include "components/navbar.html" %}
  </header>

  <!-- App Shell: Sidebar + Main Content Area -->
  <div class="app-shell flex-grow-1">
    <!-- Sidebar Navigation -->
    {% include "components/sidebar.html" %}

    <!-- Mobile Drawer Backdrop Overlay -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="window.closeMobileSidebar()" aria-hidden="true"></div>

    <!-- Main Content Area -->
    <main class="main-wrapper" id="main-content" role="main">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Reusable Toast Notification Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container" aria-live="polite"></div>

  <!-- Reusable Dynamic Modal Container (for Create Note, Categories, Tags) -->
  <div id="modal-container"></div>

  <!-- Custom Styled Confirmation Modal (Intercepts hx-confirm) -->
  <div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirmModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content border-0 shadow">
        <div class="modal-body text-center p-4">
          <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger-subtle text-danger mb-3" style="width: 52px; height: 52px;">
            <i class="bi bi-exclamation-triangle-fill fs-4"></i>
          </div>
          <h5 class="fw-bold mb-2 fs-6" id="confirmModalTitle">Confirm Action</h5>
          <p class="text-muted small mb-4" id="confirm-modal-message">Are you sure you want to proceed with this action?</p>
          <div class="d-flex gap-2 justify-content-center">
            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-sm btn-danger rounded-pill px-4 fw-semibold" id="confirm-modal-action-btn">Confirm</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <!-- Custom App JS -->
  <script src="/static/js/app.js"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
